packages:
  - apps/*
  - packages/*

nodeLinker: hoisted
virtualStoreDir: .p

allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  "@scarf/scarf": false
  esbuild: true
  msgpackr-extract: false
  prisma: true
  sharp: true
  workerd: true

onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - esbuild
  - prisma
  - sharp
  - workerd

minimumReleaseAgeExclude:
  - "@cloudflare/workers-types@5.20260809.1"
