services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lex
      POSTGRES_USER: lex
      POSTGRES_PASSWORD: lex_local_password
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lex -d lex"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    ports: ["6380:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: lex-local
      MINIO_ROOT_PASSWORD: lex-local-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio-data:/data"]
  createbuckets:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "until /usr/bin/mc alias set local http://minio:9000 lex-local lex-local-secret; do sleep 1; done;
      /usr/bin/mc mb --ignore-existing local/lex-private;
      /usr/bin/mc anonymous set none local/lex-private; exit 0;"
volumes:
  postgres-data:
  redis-data:
  minio-data:
